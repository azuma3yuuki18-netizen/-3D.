<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レールタウン 3D – 鉄道と街づくり</title>
<style>
:root{--panel:#fffaf0;--ink:#2b3a2e;--sel:#2f7dd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a362d;--ink:#eef3e8}}
:root[data-theme="dark"]{--panel:#2a362d;--ink:#eef3e8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:#bfe3f5;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;position:absolute;left:0;top:0}
#hud{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.chip{background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:0 2px 0 #0003}
#bar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;overflow-x:auto;box-shadow:0 -2px 0 #0002}
button{font:inherit;font-size:14px;font-weight:700;border:2px solid transparent;border-radius:10px;padding:6px 10px;background:#0001;color:var(--ink);cursor:pointer;white-space:nowrap;line-height:1.25}
button small{display:block;font-weight:400;opacity:.75}
button.on{border-color:var(--sel);background:#2f7dd122}
button:focus-visible{outline:3px solid var(--sel)}
#log{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 52px);max-width:230px;font-size:13px;pointer-events:none}
#log div{background:var(--panel);border-radius:8px;padding:4px 8px;margin-bottom:4px}
#dia{display:none;position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:min(330px,calc(100% - 16px));background:var(--panel);border-radius:12px;padding:10px;box-shadow:0 2px 0 #0003;font-size:13px}
#dia.open{display:block;max-height:60vh;overflow:auto}
#tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}.row span{width:70px}.row b{min-width:56px;text-align:center}
#dc{position:static;width:100%;height:130px;margin-top:6px;border-radius:8px;background:#0001;display:block}
</style>
</head>
<body>
<div id="hud"><div class="chip" id="m"></div><div class="chip" id="p"></div><div class="chip" id="d"></div><div class="chip" id="goal"></div></div>
<div id="log"></div>
<div id="dia"><div id="tabs"></div><div id="ctl"></div><canvas id="dc" width="300" height="130"></canvas></div>
<div id="bar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const GW=26,GH=16,D=[[1,0],[-1,0],[0,1],[0,-1]];
const VEH=[{n:'一般形',cars:3,cap:120,spd:2.5,up:150},{n:'通勤形',cars:5,cap:200,spd:2.2,up:260},{n:'高速形',cars:3,cap:100,spd:3.4,up:300}];
const T={rail:{n:'線路',c:50},st:{n:'駅',c:600},br:{n:'橋',c:400},dbl:{n:'複線',c:80},pass:{n:'通過',c:0},h:{n:'住宅',c:300},o:{n:'ビル',c:700},f:{n:'工場',c:900},river:{n:'川',c:100},del:{n:'撤去',c:0},view:{n:'視点',c:0},dia:{n:'ダイヤ',c:0}};
const grid=[...Array(GH)].map(()=>Array(GW).fill(null)),objs=[...Array(GH)].map(()=>Array(GW).fill(null));
let money=6000,day=0,tool='rail',trains=[],lines=[],sched={},selLine=0,logs=[],hover=[-1,-1];
const put=(x,y,t)=>grid[y][x]={t,lv:1};
const water=[...Array(GH)].map(()=>Array(GW).fill(false));
for(let y=0;y<GH;y++){const cx=Math.round(11.5+2*Math.sin(y/2.5));water[y][cx]=water[y][cx+1]=true}
let lastMsg=0;const warn=s=>{if(performance.now()-lastMsg>1500){lastMsg=performance.now();say(s)}};
const nearW=(x,y)=>D.some(([dx,dy])=>inb(x+dx,y+dy)&&water[y+dy][x+dx]);
// --- three setup
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const cv=R.domElement;document.body.prepend(cv);
const S=new THREE.Scene();S.background=new THREE.Color(0xbfe3f5);S.fog=new THREE.Fog(0xbfe3f5,35,80);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x88aa77,.75));
const sun=new THREE.DirectionalLight(0xfff2d8,.85);sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});S.add(sun);
const mats={},M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m};
const outer=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x7fb06f));outer.rotation.x=-Math.PI/2;outer.position.y=-.03;outer.receiveShadow=true;S.add(outer);
const gc=document.createElement('canvas');gc.width=GW*8;gc.height=GH*8;const gx=gc.getContext('2d');
const tex=new THREE.CanvasTexture(gc);tex.magFilter=THREE.NearestFilter;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GW,GH),new THREE.MeshLambertMaterial({map:tex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
const hb=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,.1,1)),new THREE.LineBasicMaterial({color:0x2f7dd1}));hb.position.y=.06;S.add(hb);
const cb=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(7,.05,7)),new THREE.LineBasicMaterial({color:0xffffff}));cb.position.y=.05;S.add(cb);
// --- logic helpers
const inb=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const isR=(x,y)=>inb(x,y)&&grid[y][x]&&(grid[y][x].t==='rail'||grid[y][x].t==='st'||grid[y][x].t==='br');
const pop=c=>c.t==='h'?c.lv*10:0,job=c=>c.t==='o'?c.lv*14:c.t==='f'?c.lv*18:0;
const near=(sx,sy,fn)=>{let s=0;for(let y=sy-3;y<=sy+3;y++)for(let x=sx-3;x<=sx+3;x++)if(inb(x,y)&&grid[y][x])s+=fn(grid[y][x]);return s};
const covered=(x,y)=>{for(let j=y-3;j<=y+3;j++)for(let i=x-3;i<=x+3;i++)if(inb(i,j)&&grid[j][i]&&grid[j][i].t==='st')return true;return false};
const W3=(x,y)=>[x-GW/2+.5,y-GH/2+.5];
function say(s){logs.unshift(s);logs=logs.slice(0,4);document.getElementById('log').innerHTML=logs.map(l=>'<div>'+l+'</div>').join('')}
// --- build meshes
function build(x,y){
  if(objs[y][x])S.remove(objs[y][x]);objs[y][x]=null;
  const c=grid[y][x];if(!c)return;
  const G=new THREE.Group(),[wx,wz]=W3(x,y);G.position.set(wx,0,wz);let top=.3;const rl=c.t==='rail'||c.t==='st'||c.t==='br';
  if(rl){
    const Y=c.t==='br'?.3:0,bw=c.dbl?.76:.4,ln=c.dbl?[-.19,.19]:[0];
    if(Y){G.add(bx(.95,.08,.95,0x9a8b78,0,.26,0));for(const a of[-.4,.4])for(const b of[-.4,.4])G.add(bx(.1,.3,.1,0x7a7a84,a,.12,b))}
    G.add(bx(bw,.06,bw,0x6e6256,0,.03+Y,0));
    for(const[dx,dy]of D)if(isR(x+dx,y+dy)){const hz=dx!==0;G.add(bx(hz?.5:bw,.06,hz?bw:.5,0x6e6256,dx*.25,.03+Y,dy*.25));
      for(const l of ln)for(const q of[-.09,.09]){const o=l+q;G.add(bx(hz?.5:.04,.04,hz?.04:.5,0xcfd3d8,dx*.25+(hz?0:o),.08+Y,dy*.25+(hz?o:0)))}}
    if(c.t==='st'){const hz=isR(x+1,y)||isR(x-1,y);
      const pw=c.dbl?.12:.22,po=c.dbl?.44:.36;for(const s of[-1,1])G.add(bx(hz?.95:pw,.12,hz?pw:.95,0xfffaf0,hz?0:s*po,.06,hz?s*po:0));
      G.add(bx(.95,.05,.95,c.pass?0x2f7dd1:0xd9482b,0,.55,0));
      for(const a of[-.42,.42])for(const b of[-.42,.42])G.add(bx(.05,.5,.05,0xfffaf0,a,.28,b))}
  }else if(c.t==='h'){const h=.25+.12*c.lv;G.add(bx(.6,h,.6,[0xe8c9a0,0xf0b98d,0xe79b86,0xd7826f][c.lv-1],0,h/2,0));
    const r=new THREE.Mesh(new THREE.ConeGeometry(.52,.3,4),M(0xc0503a));r.rotation.y=Math.PI/4;r.position.y=h+.15;r.castShadow=true;G.add(r);top=h+.4;
  }else if(c.t==='o'){const h=.5+.4*c.lv;G.add(bx(.6,h,.6,0x8fb0d0,0,h/2,0));G.add(bx(.62,h*.8,.4,0xdff0ff,0,h/2,0));top=h+.25;
  }else{const h=.3+.1*c.lv;G.add(bx(.85,h,.7,0x8c8c96,0,h/2,0));
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.5+.1*c.lv,8),M(0x5f5f68));ch.position.set(.25,h+.2,0);ch.castShadow=true;G.add(ch);top=h+.7}
  if(!rl){const mk=new THREE.Mesh(new THREE.ConeGeometry(.1,.22,6),M(0xd9482b));mk.rotation.x=Math.PI;mk.position.y=top;G.add(mk);G.userData.mk=mk}
  S.add(G);objs[y][x]=G;
}
function refresh(){
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const cov=covered(x,y);gx.fillStyle=(x+y)%2?(cov?'#b5dc96':'#9fcf8a'):(cov?'#bfe2a1':'#a8d493');if(water[y][x])gx.fillStyle=(x+y)%2?'#4aa3d8':'#56afe2';gx.fillRect(x*8,y*8,8,8);
    const o=objs[y][x];if(o&&o.userData.mk)o.userData.mk.visible=!cov}
  tex.needsUpdate=true;
}
// --- trains
function bfs(sx,sy){const d=new Map(),p=new Map(),q=[[sx,sy]];d.set(sx+','+sy,0);p.set(sx+','+sy,null);
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of D){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(isR(nx,ny)&&!d.has(k)){d.set(k,d.get(x+','+y)+1);p.set(k,x+','+y);q.push([nx,ny])}}}
  return{d,p}}
function rebuild(){
  trains.forEach(t=>S.remove(t.g));trains=[];lines=[];const seen=new Set(),cols=[0xd9482b,0x2f7dd1,0x2a9d5c,0xc78a00];
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(!isR(x,y)||seen.has(x+','+y))continue;
    const comp=bfs(x,y);comp.d.forEach((v,k)=>seen.add(k));
    const sts=[...comp.d.keys()].filter(k=>{const[a,b]=k.split(',').map(Number);return grid[b][a].t==='st'});
    if(sts.length<2)continue;
    const[ax,ay]=sts[0].split(',').map(Number),A=bfs(ax,ay);let far=sts[0];
    sts.forEach(k=>{if(A.d.get(k)>A.d.get(far))far=k});
    const path=[];let cur=far;while(cur){path.unshift(cur.split(',').map(Number));cur=A.p.get(cur)}
    const cfg=sts.map(k=>sched[k]).find(Boolean)||{n:1,gap:10,dwell:3,ex:0,veh:0};sts.forEach(k=>sched[k]=cfg);
    const ln={path,cfg,name:'線'+(lines.length+1)};lines.push(ln);
    const v=VEH[cfg.veh];for(let i=0;i<cfg.n;i++){const g=new THREE.Group(),ex=i>=cfg.n-cfg.ex;
      for(let j=0;j<v.cars;j++){const c=new THREE.Group();c.add(bx(.3,.22,.56,ex?0xd9482b:0x2f7dd1,0,.22,0));c.add(bx(.31,.07,.4,0xe6f2ff,0,.27,0));g.add(c)}
      g.visible=false;S.add(g);trains.push({line:ln,ex,cap:v.cap,spd:v.spd*(ex?1.25:1),up:v.up,path,pos:0,dir:1,g,stop:0,blk:0,last:0,on:false,wait:i*cfg.gap,ls:0,h:[],id:trains.length})}
  }
  renderCtl();
}
function placeTrain(tr){
  const L=tr.path.length-1;
  tr.g.children.forEach((car,i)=>{
    const p=Math.max(0,Math.min(L,tr.pos-tr.dir*i*.62)),i0=Math.min(Math.floor(p),L-1),f=p-i0,a=tr.path[i0],b=tr.path[i0+1];
    const[wx,wz]=W3(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);const ya=grid[a[1]][a[0]]?.t==='br'?.3:0,yb=grid[b[1]][b[0]]?.t==='br'?.3:0;const hx=(b[0]-a[0])*tr.dir,hz=(b[1]-a[1])*tr.dir,la=grid[a[1]][a[0]]?.dbl?.19:0,lb=grid[b[1]][b[0]]?.dbl?.19:0,lt=la+(lb-la)*f;car.position.set(wx+lt*hz,ya+(yb-ya)*f,wz-lt*hx);
    car.rotation.y=Math.atan2((b[0]-a[0])*tr.dir,(b[1]-a[1])*tr.dir)});
}
const single=(tr,i)=>i>=0&&i<tr.path.length&&!grid[tr.path[i][1]][tr.path[i][0]]?.dbl;
function regBlock(tr,ci,ni){
  if(!single(tr,ni))return false;
  let a=ni,b=ni;while(single(tr,a-1))a--;while(single(tr,b+1))b++;
  if(ci>=a&&ci<=b)return false;
  const term=a===0||b===tr.path.length-1;
  return trains.some(o=>{const r=Math.round(o.pos);return o!==tr&&o.on&&o.line===tr.line&&r>=a&&r<=b&&(term||o.dir!==tr.dir)});
}
const blocker=(tr,ni)=>{const c=grid[tr.path[ni][1]][tr.path[ni][0]];for(const o of trains)if(o!==tr&&o.on&&o.line===tr.line&&Math.round(o.pos)===ni){
  if(o.dir===tr.dir){if(c?.t==='st'&&c.dbl&&o.stop>0)continue;return o}
  if(!c?.dbl)return o}return null};
function arrive(tr,k){
  const h=tr.path[k],f=tr.path[tr.last],pf=near(f[0],f[1],pop),jf=near(f[0],f[1],job),ph=near(h[0],h[1],pop),jh=near(h[0],h[1],job);
  const r=Math.min(tr.cap,Math.min(pf,jh)+Math.min(jf,ph)+Math.round((pf+jf+ph+jh)/12)),inc=Math.round(r*Math.abs(k-tr.last)*(tr.ex?3.9:3));
  if(inc>0){money+=inc;say(tr.line.name+(tr.ex?'急行 ':' ')+r+'人 +¥'+inc)}
  tr.last=k;tr.stop=tr.line.cfg.dwell;
  if(k===0){tr.on=false;tr.g.visible=false;tr.wait=tr.line.cfg.gap;tr.h.push([tm,null]);return}
  if(k===tr.path.length-1)tr.dir=-1;
  const c=grid[h[1]][h[0]];
  if(!tr.ex&&c.dbl&&c.t==='st'&&k>0&&k<tr.path.length-1)
    for(const o of trains)if(o.ex&&o.on&&o.line===tr.line&&o.dir===tr.dir){const d=(tr.pos-o.pos)*tr.dir;if(d>0&&d<12){tr.stop=Math.max(tr.stop,Math.min(18,d/o.spd+2));say('待避:急行の通過待ち')}}
}
function step(tr,dt){
  const L=tr.path.length-1,np=tr.pos+tr.dir*tr.spd*dt,ci=Math.round(tr.pos),ni=Math.round(np);
  if(ni!==ci&&ni>=0&&ni<=L){if(regBlock(tr,ci,ni))return;const bl=blocker(tr,ni);
    if(bl){tr.blk+=dt;if(bl.dir!==tr.dir&&tr.blk>5&&tr.id<bl.id){tr.dir*=-1;tr.blk=0;money-=200;say('正面で止まり折返し -¥200')}return}}
  tr.blk=0;
  const k=tr.dir>0?Math.min(Math.floor(np),L):Math.max(Math.ceil(np),0),crossed=tr.dir>0?k>Math.floor(tr.pos):k<Math.ceil(tr.pos);
  if(crossed&&(k===0||k===L||((c)=>c?.t==='st'&&!(tr.ex&&c.pass))(grid[tr.path[k][1]][tr.path[k][0]]))){tr.pos=k;arrive(tr,k)}
  else tr.pos=clamp(np,0,L);
}
function renderCtl(){
  const tabs=document.getElementById('tabs'),ctl=document.getElementById('ctl');
  if(selLine>=lines.length)selLine=0;const ln=lines[selLine];
  tabs.innerHTML=lines.map((l,i)=>`<button data-i="${i}" class="${i===selLine?'on':''}">${l.name}</button>`).join('')||'駅を2つ以上つなぐと路線ができます';
  if(!ln){ctl.innerHTML='';return}
  const c=ln.cfg,v=VEH[c.veh],val={n:c.n+'本',ex:c.ex+'本',gap:c.gap+'秒',dwell:c.dwell+'秒',veh:v.n};
  ctl.innerHTML=[['n','運行本数'],['ex','うち急行'],['veh','車両'],['gap','運転間隔'],['dwell','停車時間']].map(([k,lb])=>`<div class="row"><span>${lb}</span><button data-k="${k}" data-d="-1">−</button><b>${val[k]}</b><button data-k="${k}" data-d="1">+</button></div>`).join('')+`<div class="row"><small>${v.n}: ${v.cars}両 定員${v.cap} 速度${v.spd} 維持費¥${v.up}/月</small></div>`;
}
document.getElementById('tabs').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){selLine=+i;renderCtl()}};
document.getElementById('ctl').onclick=e=>{const k=e.target.dataset.k;if(!k)return;const ln=lines[selLine],r={n:[1,4],ex:[0,4],veh:[0,2],gap:[4,20],dwell:[1,8]}[k];
  ln.cfg[k]=clamp(ln.cfg[k]+(+e.target.dataset.d),r[0],r[1]);ln.cfg.ex=Math.min(ln.cfg.ex,ln.cfg.n);if(k!=='dwell')rebuild();else renderCtl()};
function drawDia(){
  const c=document.getElementById('dc'),x=c.getContext('2d'),W=c.width,H=c.height,ink=getComputedStyle(document.documentElement).getPropertyValue('--ink');
  x.clearRect(0,0,W,H);const ln=lines[selLine];if(!ln)return;
  x.strokeStyle=ink;x.fillStyle=ink;x.lineWidth=1;x.globalAlpha=.25;
  ln.path.forEach((p,i)=>{const sc=grid[p[1]][p[0]];if(sc?.t==='st'){x.setLineDash(sc.pass?[4,4]:[]);const y=6+i/(ln.path.length-1)*(H-12);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}});x.setLineDash([]);
  x.globalAlpha=.7;x.font='11px sans-serif';x.fillText('始発側',3,H-8);x.fillText('終点側 (横軸:60秒)',3,16);x.globalAlpha=1;
  const cl=['#d9482b','#2f7dd1','#2a9d5c','#c78a00'];
  trains.filter(t=>t.line===ln).forEach((t,i)=>{x.strokeStyle=t.ex?'#d9482b':'#2f7dd1';x.lineWidth=2;x.beginPath();let on=false;
    for(const[tt,f]of t.h){if(f===null){on=false;continue}const px=W-(tm-tt)/60*W;if(px<0)continue;const y=6+f*(H-12);on?x.lineTo(px,y):x.moveTo(px,y);on=true}x.stroke()});
}
// --- actions
function touch(x,y,r){build(x,y);if(r){for(const[dx,dy]of D)if(inb(x+dx,y+dy))build(x+dx,y+dy);rebuild()}refresh()}
function act(x,y){
  if(!inb(x,y)||tool==='view')return;const c=grid[y][x],w=water[y][x];
  if(tool==='del'){if(c){const r=c.t==='rail'||c.t==='st'||c.t==='br';grid[y][x]=null;touch(x,y,r)}else if(w){water[y][x]=false;refresh()}return}
  if(tool==='pass'){if(c&&c.t==='st'){c.pass=!c.pass;build(x,y);say(c.pass?'この駅は急行が通過します':'この駅は急行も停車します')}return}
  if(tool==='dbl'){if(c&&['rail','st','br'].includes(c.t)&&!c.dbl&&money>=80){c.dbl=true;money-=80;touch(x,y,false)}return}
  if(c||money<T[tool].c)return;
  if(tool==='river'){if(w)return;water[y][x]=true;money-=T[tool].c;refresh();return}
  if(tool==='br'){if(!w){warn('橋は水の上にだけ架けられます');return}}
  else if(w){warn('水の上には橋が必要です');return}
  money-=T[tool].c;put(x,y,tool);touch(x,y,tool==='rail'||tool==='st'||tool==='br');
}
// --- input
const bar=document.getElementById('bar'),dia=document.getElementById('dia');
for(const k in T){const b=document.createElement('button');b.dataset.k=k;b.innerHTML=T[k].n+'<small>'+(T[k].c?'¥'+T[k].c:k==='view'?'ドラッグで回転':k==='dia'?'運行図表':k==='pass'?'駅を切替':'')+'</small>';b.onclick=()=>{if(k==='dia'){dia.classList.toggle('open');renderCtl();return}tool=k;sync()};bar.appendChild(b)}
function sync(){[...bar.children].forEach(b=>b.classList.toggle('on',b.dataset.k===tool))}sync();
let yaw=.6,pitch=.9,dist=24;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),mv=new THREE.Vector2(),pt=new THREE.Vector3();
function tileAt(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  if(!ray.ray.intersectPlane(pl,pt))return[-1,-1];return[Math.floor(pt.x+GW/2),Math.floor(pt.z+GH/2)]}
const ptrs=new Map();let mode=null,pd=0;
const pinch=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>1){mode='pinch';pd=pinch();return}
  mode=(tool==='view'||e.button===2)?'orbit':'paint';if(mode==='paint')act(...tileAt(e))});
cv.addEventListener('pointermove',e=>{
  hover=tileAt(e);const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(mode==='orbit'){yaw-=dx*.006;pitch=clamp(pitch+dy*.005,.25,1.4)}
  else if(mode==='pinch'&&ptrs.size>1){const d=pinch();dist=clamp(dist*pd/d,8,45);pd=d}
  else if(mode==='paint'&&(tool==='rail'||tool==='del'||tool==='dbl'))act(...hover)});
const up=e=>{ptrs.delete(e.pointerId);mode=ptrs.size?'pinch':null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{dist=clamp(dist*(1+e.deltaY*.001),8,45)},{passive:true});
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
// --- simulation
function tick(){
  day++;let ch=false;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=grid[y][x];
    if(c&&['h','o','f'].includes(c.t)&&c.lv<4&&covered(x,y)&&Math.random()<(nearW(x,y)?.045:.03)){c.lv++;build(x,y);ch=true}}
  if(ch)refresh();
  if(day%30===0){let tp=0,rails=0,sts=0,brs=0,dbls=0;grid.forEach(r=>r.forEach(c=>{if(!c)return;tp+=pop(c);if(c.t==='rail')rails++;if(c.t==='st')sts++;if(c.t==='br')brs++;if(c.dbl)dbls++}));
    const tax=tp*4,cost=rails*8+sts*60+brs*30+dbls*10+trains.reduce((a,t)=>a+t.up,0);money+=tax-cost;say(day/30+'か月目:税収 ¥'+tax+' / 維持費 ¥'+cost)}
}
let last=0,acc=0,tm=0;
function loop(t){
  const dt=Math.min((t-last)/1000,.1);last=t;acc+=dt;while(acc>.5){acc-=.5;tick()}
  tm+=dt;
  for(const tr of trains){
    if(!tr.on){tr.wait-=dt;if(tr.wait>0)continue;
      if(regBlock(tr,-1,0)||blocker(tr,0)){if(!tr.told){tr.told=1;say(tr.line.name+':単線のため発車待ち(折返し駅を複線に)')}continue}
      tr.told=0;tr.on=true;tr.g.visible=true;tr.pos=0;tr.dir=1;tr.last=0;tr.stop=0}
    if(tr.stop>0)tr.stop-=dt;else step(tr,dt);
    placeTrain(tr);
    if(tm-tr.ls>.3){tr.ls=tm;tr.h.push([tm,tr.pos/(tr.path.length-1)]);if(tr.h.length>400)tr.h.shift()}
  }
  if(dia.classList.contains('open'))drawDia();
  cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);
  const[hx,hy]=hover,ok=inb(hx,hy);hb.visible=ok&&tool!=='view';cb.visible=hb.visible&&tool==='st';
  if(ok){const[wx,wz]=W3(hx,hy);hb.position.x=cb.position.x=wx;hb.position.z=cb.position.z=wz}
  let tp=0,tj=0;grid.forEach(r=>r.forEach(c=>{if(c){tp+=pop(c);tj+=job(c)}}));
  document.getElementById('m').textContent='資金 ¥'+Math.floor(money).toLocaleString();
  document.getElementById('p').textContent='人口 '+tp+' / 雇用 '+tj;
  document.getElementById('d').textContent=Math.floor(day/30)+'か月 '+day%30+'日';
  document.getElementById('goal').textContent=tp>=600?'目標達成!人口600':'目標:人口600';
  R.render(S,cam);requestAnimationFrame(loop);
}
[[5,4,'h'],[6,4,'h'],[5,6,'h'],[19,10,'o'],[20,10,'o'],[18,12,'f'],[7,10,'h']].forEach(a=>{put(...a);build(a[0],a[1])});
say('「通過」で駅を切替。複線の駅なら急行が各停を追い越せます');
refresh();requestAnimationFrame(loop);
</script>
