<script>
const GW=26,GH=16,D=[[1,0],[-1,0],[0,1],[0,-1]];
const dia=document.getElementById('dia'),stp=document.getElementById('stp'),tep=document.getElementById('tep'),cmp=document.getElementById('cmp');
const CT={M:{n:'動力車',cap:40,pw:3,w:1.2,up:60},T:{n:'付随車',cap:45,pw:0,w:1,up:40},G:{n:'グリーン車',cap:20,pw:0,w:1.1,up:55}};
const PAL=[0x2f7dd1,0x2a9d5c,0xc78a00,0xd9482b,0x8e5bd6,0x20a4a4,0xe8e8ee,0x4a4f5e];
const SH={box:{n:'角形',sp:1,cp:1,up:1},bullet:{n:'流線形',sp:1.08,cp:.95,up:1.1},dd:{n:'二階建て',sp:.92,cp:1.3,up:1.1},arc:{n:'丸屋根',sp:1.03,cp:1,up:1}};
const mk=(n,list,col,o={})=>{let cap=0,pw=0,w=0,up=0,g=0;const sh=SH[o.shape||'box'],pf={sp:1,cp:1,fr:1,...(o.perf||{})};

  return{n,list,col,acc:o.acc??0xe8e8ee,shape:o.shape||'box',stripe:o.stripe||'none',logo:o.logo||'',lpos:o.lpos||'head',perf:pf,
    cap:Math.round(cap*sh.cp*pf.cp),up:Math.round(up*sh.up*(.2+.5*pf.sp+.3*pf.cp)),cars:list.length,fm:(1+.8*g/list.length)*pf.fr,
    spd:pw?Math.min(4.2,+((1.3+pw/w*1.2)*sh.sp*pf.sp).toFixed(1)):.8}};
const VEH=[mk('一般形',['M','T','T'],0x2f7dd1,{stripe:'band'}),mk('通勤形',['M','T','T','T','T'],0x2a9d5c,{stripe:'wide',shape:'arc'}),mk('高速形',['M','M','G'],0xc78a00,{shape:'bullet',stripe:'two',logo:'★'})];
const vehs=()=>VEH.concat(custom);
const T={rail:{n:'線路',c:50},st:{n:'駅',c:600},edit:{n:'駅編集',c:0},route:{n:'経路',c:0},tedit:{n:'車両編集',c:0},cam:{n:'列車追跡',c:0},br:{n:'橋',c:400},dbl:{n:'複線',c:80},pass:{n:'通過',c:0},h:{n:'住宅',c:300},o:{n:'ビル',c:700},f:{n:'工場',c:900},river:{n:'川',c:100},del:{n:'撤去',c:0},view:{n:'視点',c:0},dia:{n:'ダイヤ',c:0}};
const grid=[...Array(GH)].map(()=>Array(GW).fill(null)),objs=[...Array(GH)].map(()=>Array(GW).fill(null));
let money=6000,day=0,tool='rail',trains=[],lines=[],sched={},selLine=0,routes=[],camMode='free',camKey=null,custom=[],selVeh=0,selSt=null,stN=0,logs=[],hover=[-1,-1];
const put=(x,y,t)=>grid[y][x]={t,lv:1};
const water=[...Array(GH)].map(()=>Array(GW).fill(false));
for(let y=0;y<GH;y++){const cx=Math.round(11.5+2*Math.sin(y/2.5));water[y][cx]=water[y][cx+1]=true}
let lastMsg=0;const warn=s=>{if(performance.now()-lastMsg>1500){lastMsg=performance.now();say(s)}};
const nearW=(x,y)=>D.some(([dx,dy])=>inb(x+dx,y+dy)&&water[y+dy][x+dx]);
// --- three setup
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const cv=R.domElement;document.body.prepend(cv);
const S=new THREE.Scene();S.background=new THREE.Color(0xbfe3f5);S.fog=new THREE.Fog(0xbfe3f5,35,80);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x88aa77,.75));
const sun=new THREE.DirectionalLight(0xfff2d8,.85);sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});S.add(sun);
const mats={},M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m};
const outer=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x7fb06f));outer.rotation.x=-Math.PI/2;outer.position.y=-.03;outer.receiveShadow=true;S.add(outer);
const gc=document.createElement('canvas');gc.width=GW*8;gc.height=GH*8;const gx=gc.getContext('2d');
const tex=new THREE.CanvasTexture(gc);tex.magFilter=THREE.NearestFilter;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GW,GH),new THREE.MeshLambertMaterial({map:tex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
const hb=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,.1,1)),new THREE.LineBasicMaterial({color:0x2f7dd1}));hb.position.y=.06;S.add(hb);
const cb=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(7,.05,7)),new THREE.LineBasicMaterial({color:0xffffff}));cb.position.y=.05;S.add(cb);
const rline=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xff9f1c,depthTest:false}));rline.renderOrder=4;rline.frustumCulled=false;rline.visible=false;S.add(rline);
// --- logic helpers
const inb=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const isR=(x,y)=>inb(x,y)&&grid[y][x]&&(grid[y][x].t==='rail'||grid[y][x].t==='st'||grid[y][x].t==='br');
const pop=c=>c.t==='h'?c.lv*10:0,job=c=>c.t==='o'?c.lv*14:c.t==='f'?c.lv*18:0;
const rad=c=>3+(c?.g||0);
const near=(sx,sy,fn,r=3)=>{let s=0;for(let y=sy-r;y<=sy+r;y++)for(let x=sx-r;x<=sx+r;x++)if(inb(x,y)&&grid[y][x])s+=fn(grid[y][x]);return s};
const covered=(x,y)=>{for(let j=y-5;j<=y+5;j++)for(let i=x-5;i<=x+5;i++){const c=inb(i,j)&&grid[j][i];if(c&&c.t==='st'&&Math.max(Math.abs(i-x),Math.abs(j-y))<=rad(c))return true}return false};
const W3=(x,y)=>[x-GW/2+.5,y-GH/2+.5];
function say(s){logs.unshift(s);logs=logs.slice(0,4);document.getElementById('log').innerHTML=logs.map(l=>'<div>'+l+'</div>').join('')}
// --- build meshes
function build(x,y){
  if(objs[y][x])S.remove(objs[y][x]);objs[y][x]=null;
  const c=grid[y][x];if(!c)return;
  const G=new THREE.Group(),[wx,wz]=W3(x,y);G.position.set(wx,0,wz);let top=.3;const rl=c.t==='rail'||c.t==='st'||c.t==='br';
  if(rl){
    const Y=c.t==='br'?.3:0,NT=c.t==='st'?(c.tr||(c.dbl?2:1)):(c.dbl?2:1),bw=[0,.4,.76,.88,.94][NT],ln=[0,[0],[-.19,.19],[-.27,0,.27],[-.3,-.1,.1,.3]][NT],gq=NT===4?.06:.09;
    if(Y){G.add(bx(.95,.08,.95,0x9a8b78,0,.26,0));for(const a of[-.4,.4])for(const b of[-.4,.4])G.add(bx(.1,.3,.1,0x7a7a84,a,.12,b))}
    G.add(bx(bw,.06,bw,0x6e6256,0,.03+Y,0));
    for(const[dx,dy]of D)if(isR(x+dx,y+dy)){const hz=dx!==0;G.add(bx(hz?.5:bw,.06,hz?bw:.5,0x6e6256,dx*.25,.03+Y,dy*.25));
      for(const l of ln)for(const q of[-gq,gq]){const o=l+q;G.add(bx(hz?.5:.04,.04,hz?.04:.5,0xcfd3d8,dx*.25+(hz?0:o),.08+Y,dy*.25+(hz?o:0)))}}
    if(c.t==='st'){const hz=isR(x+1,y)||isR(x-1,y);
      const pw=NT>=3?.08:c.dbl?.12:.22,po=NT>=3?.46:c.dbl?.44:.36;for(const s of[-1,1])G.add(bx(hz?.95:pw,.12,hz?pw:.95,0xfffaf0,hz?0:s*po,.06,hz?s*po:0));
      G.add(bx(.95,.05,.95,c.pass?0x2f7dd1:0xd9482b,0,.55,0));
      for(const a of[-.42,.42])for(const b of[-.42,.42])G.add(bx(.05,.5,.05,0xfffaf0,a,.28,b));if(!c.name)c.name=SN(stN++);{const lb=label(c.name+(c.nl>1?' ⇄':''));lb.visible=camMode!=='front';G.userData.lb=lb;G.add(lb)};if(c.g){const hh=.1+.12*c.g;G.add(bx(.4,hh,.4,0xe8dcc8,0,.58+hh/2,0))}}
  }else if(c.t==='h'){const h=.25+.12*c.lv;G.add(bx(.6,h,.6,[0xe8c9a0,0xf0b98d,0xe79b86,0xd7826f][c.lv-1],0,h/2,0));
    const r=new THREE.Mesh(new THREE.ConeGeometry(.52,.3,4),M(0xc0503a));r.rotation.y=Math.PI/4;r.position.y=h+.15;r.castShadow=true;G.add(r);top=h+.4;
  }else if(c.t==='o'){const h=.5+.4*c.lv;G.add(bx(.6,h,.6,0x8fb0d0,0,h/2,0));G.add(bx(.62,h*.8,.4,0xdff0ff,0,h/2,0));top=h+.25;
  }else{const h=.3+.1*c.lv;G.add(bx(.85,h,.7,0x8c8c96,0,h/2,0));
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.5+.1*c.lv,8),M(0x5f5f68));ch.position.set(.25,h+.2,0);ch.castShadow=true;G.add(ch);top=h+.7}
  if(!rl){const mk=new THREE.Mesh(new THREE.ConeGeometry(.1,.22,6),M(0xd9482b));mk.rotation.x=Math.PI;mk.position.y=top;G.add(mk);G.userData.mk=mk}
  S.add(G);objs[y][x]=G;
}
function refresh(){
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const cov=covered(x,y);gx.fillStyle=(x+y)%2?(cov?'#b5dc96':'#9fcf8a'):(cov?'#bfe2a1':'#a8d493');if(water[y][x])gx.fillStyle=(x+y)%2?'#4aa3d8':'#56afe2';gx.fillRect(x*8,y*8,8,8);
    const o=objs[y][x];if(o&&o.userData.mk)o.userData.mk.visible=!cov}
  tex.needsUpdate=true;
}
// --- trains
function bfs(sx,sy){const d=new Map(),p=new Map(),q=[[sx,sy]];d.set(sx+','+sy,0);p.set(sx+','+sy,null);
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of D){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(isR(nx,ny)&&!d.has(k)){d.set(k,d.get(x+','+y)+1);p.set(k,x+','+y);q.push([nx,ny])}}}
  return{d,p}}
const deg=(x,y)=>D.filter(([dx,dy])=>isR(x+dx,y+dy)).length;
function routePath(r){
  if(r.stops.length<2)return null;let path=[];
  for(let i=0;i<r.stops.length-1;i++){
    const a=r.stops[i],b=r.stops[i+1],[ax,ay]=a.split(',').map(Number),[bx,by]=b.split(',').map(Number);
    if(!isR(ax,ay)||!isR(bx,by)||grid[ay][ax].t!=='st'||grid[by][bx].t!=='st')return null;
    const A=bfs(ax,ay);if(!A.d.has(b))return null;
    const seg=[];let cur=b;while(cur){seg.unshift(cur.split(',').map(Number));cur=A.p.get(cur)}
    path=path.concat(i?seg.slice(1):seg);
  }
  return new Set(path.map(p=>p+'')).size===path.length?path:null;
}
function rebuild(){
  annSeen.clear();trains.forEach(t=>S.remove(t.g));trains=[];lines=[];const cid=new Map(),comps=[];
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if(!isR(x,y)||cid.has(x+','+y))continue;const comp=bfs(x,y);comp.d.forEach((v,k)=>cid.set(k,comps.length));comps.push(comp)}
  const addLine=(path,cfg,name,ci,route)=>{
    const ln={path,cfg,name,route};lines.push(ln);const v=vehs()[cfg.veh]||VEH[0];
    for(let i=0;i<cfg.n;i++){const g=new THREE.Group(),ex=i>=cfg.n-cfg.ex;
      for(let j=0;j<v.list.length;j++)g.add(mkCar(v,j,ex))
      g.visible=false;S.add(g);trains.push({line:ln,idx:i,comp:ci,ex,fm:v.fm,el:Math.pow(v.perf.fr,-1.3),len:v.cars,cap:v.cap,spd:v.spd*(ex?1.25:1),up:v.up,path,pos:0,dir:1,g,stop:0,blk:0,last:0,on:false,wait:i*cfg.gap,ls:0,h:[],id:trains.length})}
  };
  if(routes.length){for(const r of routes){const p=routePath(r);r.ok=!!p;if(p)addLine(p,r.cfg,r.name,cid.get(p[0]+''),r)}}
  else comps.forEach((comp,ci)=>{
    const sts=[...comp.d.keys()].filter(k=>{const[a,b]=k.split(',').map(Number);return grid[b][a].t==='st'});
    if(sts.length<2)return;
    const pathOf=(a,b)=>{const A=bfs(...a.split(',').map(Number)),p=[];let cur=b;while(cur){p.unshift(cur.split(',').map(Number));cur=A.p.get(cur)}return p};
    const lv=sts.filter(k=>{const[a,b]=k.split(',').map(Number);return deg(a,b)<=1});let paths=[];
    if(lv.length>=2){
      const cov=new Set(),ek=(p,q)=>[p+'',q+''].sort().join('-'),cand=[];
      for(let i=0;i<lv.length;i++)for(let j=i+1;j<lv.length;j++)cand.push(pathOf(lv[i],lv[j]));
      for(let r=0;r<4;r++){let best=null,bn=0;
        for(const p of cand){let n=0;for(let i=0;i<p.length-1;i++)if(!cov.has(ek(p[i],p[i+1])))n++;if(n>bn||(n===bn&&n>0&&p.length>best.length)){best=p;bn=n}}
        if(!best)break;paths.push(best);for(let i=0;i<best.length-1;i++)cov.add(ek(best[i],best[i+1]))}
    }
    if(!paths.length){const A=bfs(...sts[0].split(',').map(Number));let far=sts[0];sts.forEach(k=>{if(A.d.get(k)>A.d.get(far))far=k});paths=[pathOf(sts[0],far)]}
    for(const path of paths){const key=path[0]+'|'+path[path.length-1];addLine(path,sched[key]||(sched[key]={n:1,gap:10,dwell:3,ex:0,veh:0}),'路線'+(lines.length+1),ci)}
  });
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=grid[y][x];if(c&&c.t==='st'){c.ln=[];c.nl=0}}
  for(const ln of lines)for(const p of ln.path){const c=grid[p[1]][p[0]];if(c&&c.t==='st'){c.ln.push(ln.name);c.nl++}}
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=grid[y][x];if(c&&c.t==='st'&&c.pn!==c.nl){c.pn=c.nl;build(x,y)}}
  renderCtl();
}
function placeTrain(tr){
  const L=tr.path.length-1;
  tr.g.children.forEach((car,i)=>{
    const p=Math.max(0,Math.min(L,tr.pos-tr.dir*i*.62)),i0=Math.min(Math.floor(p),L-1),f=p-i0,a=tr.path[i0],b=tr.path[i0+1];
    const[wx,wz]=W3(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);const ya=grid[a[1]][a[0]]?.t==='br'?.3:0,yb=grid[b[1]][b[0]]?.t==='br'?.3:0;const hx=(b[0]-a[0])*tr.dir,hz=(b[1]-a[1])*tr.dir,la=lane(tr,a),lb=lane(tr,b),lt=la+(lb-la)*f;car.position.set(wx+lt*hz,ya+(yb-ya)*f,wz-lt*hx);
    car.rotation.y=Math.atan2((b[0]-a[0])*tr.dir,(b[1]-a[1])*tr.dir)});
}
const single=(tr,i)=>i>=0&&i<tr.path.length&&!grid[tr.path[i][1]][tr.path[i][0]]?.dbl;
const hv=(tr,i)=>{const L=tr.path.length-1,a=tr.path[i],b=tr.path[Math.max(0,Math.min(L,i+tr.dir))];return[b[0]-a[0],b[1]-a[1]]};
const dot=(u,v)=>u[0]*v[0]+u[1]*v[1];
const opp=(tr,ci,ni,o)=>dot([tr.path[ni][0]-tr.path[ci][0],tr.path[ni][1]-tr.path[ci][1]],hv(o,Math.round(o.pos)))<0;
function regBlock(tr,ci,ni){
  if(!single(tr,ni))return false;

  if(ctr&&ctr.on){const[a,b,c,d,e,f]=camCalc(ctr,dt);cam.position.set(a,b,c);cam.lookAt(d,e,f)}
  else if(camMode==='free'){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0)}
  for(const t of trains){const c0=t.g.children[0];if(c0)c0.visible=!(camMode==='front'&&t===ctr)}
  if(ctr&&ctr.on)annTick(ctr);
  if(camMode!=='free'&&tm-cabT>.15){cabT=tm;updCab(ctr)}
  const[hx,hy]=hover,ok=inb(hx,hy);hb.visible=ok&&tool!=='view'&&camMode!=='front';cb.visible=false;
  if(ok){const[wx,wz]=W3(hx,hy);hb.position.x=wx;hb.position.z=wz;if(tool==='st'){cb.position.x=wx;cb.position.z=wz;cb.scale.set(1,1,1);cb.visible=true}}
  if(selSt){const[wx,wz]=W3(selSt[0],selSt[1]),k=(2*rad(grid[selSt[1]][selSt[0]])+1)/7;cb.position.x=wx;cb.position.z=wz;cb.scale.set(k,1,k);cb.visible=true}
  let tp=0,tj=0;grid.forEach(r=>r.forEach(c=>{if(c){tp+=pop(c);tj+=job(c)}}));
  document.getElementById('m').textContent='資金 ¥'+Math.floor(money).toLocaleString();
  document.getElementById('p').textContent='人口 '+tp+' / 雇用 '+tj;
  document.getElementById('d').textContent=Math.floor(day/30)+'か月 '+day%30+'日';
  document.getElementById('goal').textContent=tp>=600?'目標達成!人口600':'目標:人口600';
  R.render(S,cam);requestAnimationFrame(loop);
}
[[5,4,'h'],[6,4,'h'],[5,6,'h'],[19,10,'o'],[20,10,'o'],[18,12,'f'],[7,10,'h']].forEach(a=>{put(...a);build(a[0],a[1])});
say('線路を分岐させ、分岐点を駅にすると乗換駅になります');
refresh();requestAnimationFrame(loop);
